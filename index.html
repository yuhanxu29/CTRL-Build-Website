<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="description" content="CTRL Build is a one-day commerce hackathon in Toronto, hosted by RCEO, RCIG and RCVC. March 2027, 10:00 to 20:00. No code required.">
  <title>CTRL Build | March 2027</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CTRL Build | March 2027">
  <meta property="og:description" content="A one-day commerce hackathon in Toronto. No code required.">
  <meta property="og:url" content="https://ctrlbuild.vercel.app/">
  <meta property="og:image" content="https://ctrlbuild.vercel.app/assets/og.jpg">
  <link rel="canonical" href="https://ctrlbuild.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <button class="keycap-control" type="button" data-build-toggle aria-label="Build mode" aria-pressed="false" aria-keyshortcuts="Control+B">
        <svg viewBox="0 0 200 120" width="56" height="34" aria-hidden="true" focusable="false">
          <rect class="kc-base" x="2" y="12" width="92" height="96" rx="20"/>
          <rect class="kc-top" x="2" y="4" width="92" height="96" rx="20"/>
          <text class="kc-t" x="48" y="60" text-anchor="middle">CTRL</text>
          <rect class="kc-base" x="106" y="12" width="92" height="96" rx="20"/>
          <rect class="kc-b" x="106" y="4" width="92" height="96" rx="20"/>
          <text class="kc-bt" x="152" y="72" text-anchor="middle">B</text>
        </svg>
        <span>CTRL Build</span>
      </button>
      <button class="button menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
      <nav class="primary-nav" id="primary-nav" aria-label="Main">
        <a href="#what">What</a>
        <a href="#tracks">Tracks</a>
        <a href="#day">The day</a>
        <a href="#sponsors">Sponsors</a>
        <a href="#faq">FAQ</a>
      </nav>
      <div class="header-actions">
        <a class="button button-primary" href="#sponsors">For sponsors</a>
        <button class="button header-notify" type="button" data-open="notify">Get notified</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Upper sections start -->
    <section id="top"></section>
    <section id="what"></section>
    <section id="tracks"></section>
    <section id="day"></section>
    <section id="prizes"></section>
    <!-- Upper sections end -->

    <!-- Lower sections start -->
    <section id="sponsors"></section>
    <section id="faq"></section>
    <section id="hosts"></section>
    <section id="closing"></section>
    <!-- Lower sections end -->
  </main>

  <!-- Footer content start -->
  <footer class="site-footer" id="notify">
    <div class="wrap">
      <a href="#top">CTRL Build</a>
      <a href="mailto:ctrlbuildto@gmail.com">ctrlbuildto@gmail.com</a>
    </div>
  </footer>
  <!-- Footer content end -->

  <dialog class="modal" id="modal" aria-labelledby="mTitle" aria-describedby="mSub">
    <div class="modal-inner">
      <header class="modal-header">
        <h2 id="mTitle"></h2>
        <p id="mSub"></p>
        <button class="button modal-close" type="button" id="mClose">Close</button>
      </header>
      <div id="mBody"></div>
      <p class="form-feedback" id="mFeedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </dialog>
</body>
</html>
